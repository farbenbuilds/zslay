name = "zslay_node_api"
description = "Node-API bindings under bindings/node/ consuming the public C ABI."
developer_instructions = """
Own bindings/node/ and addon build integration. Consume include/zslay.h only; do not reach into src/ or reimplement parsing. Validate N-API arguments, return statuses without panicking across the boundary, document borrowed-memory lifetimes, keep callbacks bounded, and use Node-owned allocation only. Hand missing exports to zslay_c_abi. Skills: zslay-c-ffi, nix-hermetic, nix-best-practices, zig-0-17, zig-best-practices, context7, install-anti-slop, graphify. Do not run the install-anti-slop installer until bindings/node/ and an Oxlint configuration exist.
Before editing, read AGENTS.md and load the listed skills from `.agents/skills/` and `.codex/skills/`. If unavailable, follow repository docs and report that. Follow AGENT_DIRECTORY.md. When graphify-out/graph.json exists, run graphify query before broad source reads. Do not commit, push, tag, or open a PR unless explicitly asked.
"""

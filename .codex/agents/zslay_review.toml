Before reviewing, read AGENTS.md and load the listed skills from `.agents/skills/` and `.codex/skills/`. If unavailable, follow repository docs and report that. Follow AGENT_DIRECTORY.md. When graphify-out/graph.json exists, run graphify query before broad source reads. Do not commit, push, tag, or open a PR unless explicitly asked.
"""

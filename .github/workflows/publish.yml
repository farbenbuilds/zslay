name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Version and Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches build.zig.zon
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZON_VERSION="$(sed -nE 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon | head -n 1)"
          if [ -z "$ZON_VERSION" ]; then
            echo "::error::could not parse .version from build.zig.zon"
            exit 1
          fi
          if [ "$VERSION" != "$ZON_VERSION" ]; then
            echo "::error::tag v$VERSION does not match build.zig.zon version $ZON_VERSION"
            exit 1
          fi

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { prefix = "## [" ver "]" }
            !found && substr($0, 1, length(prefix)) == prefix { found = 1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ] || ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md is missing a non-empty ## [$VERSION] section"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release_notes.md

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Run test suite
        run: zig build test --summary all

  build:
    name: Build Artifacts
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - default
          - windows-x86_64
          - macos-x86_64
          - macos-aarch64
          - linux-x86_64-gnu
          - linux-aarch64-gnu
          - linux-x86_64-musl
          - linux-aarch64-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix evaluation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nix
          key: ${{ runner.os }}-nix-eval-${{ hashFiles('flake.lock') }}

      - name: Build target
        run: nix build .#${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          nix develop .#default -c bash -c '
            for file in result/lib/*; do
              filename=$(basename "$file")

              # Standardize the archive name to always start with zslay instead of libzslay
              archivename="zslay-${{ matrix.target }}"

              if [[ "${{ matrix.target }}" == windows-* ]]; then
                zip -j "dist/${archivename}.zip" "result/lib/$filename" result/include/zslay.h
              else
                tar -cjf "dist/${archivename}.tar.bz2" -C result "lib/$filename" include/zslay.h
                tar -czf "dist/${archivename}.tar.gz" -C result "lib/$filename" include/zslay.h
                tar -cJf "dist/${archivename}.tar.xz" -C result "lib/$filename" include/zslay.h
              fi
            done
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zslay-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    environment: Production Release
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: zslay-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release_notes.md
          files: artifacts/*

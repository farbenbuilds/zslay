name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - default
          - windows-x86_64
          - macos-x86_64
          - macos-aarch64
          - linux-x86_64-gnu
          - linux-aarch64-gnu
          - linux-x86_64-musl
          - linux-aarch64-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix evaluation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nix
          key: ${{ runner.os }}-nix-eval-${{ hashFiles('flake.lock') }}

      - name: Build target
        run: nix build .#${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          nix develop .#default -c bash -c '
            for file in result/lib/*; do
              filename=$(basename "$file")

              # Standardize the archive name to always start with zslay instead of libzslay
              archivename="zslay-${{ matrix.target }}"

              if [[ "${{ matrix.target }}" == windows-* ]]; then
                zip -j "dist/${archivename}.zip" "result/lib/$filename" result/include/zslay.h
              else
                tar -cjf "dist/${archivename}.tar.bz2" -C result "lib/$filename" include/zslay.h
                tar -czf "dist/${archivename}.tar.gz" -C result "lib/$filename" include/zslay.h
                tar -cJf "dist/${archivename}.tar.xz" -C result "lib/$filename" include/zslay.h
              fi
            done
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zslay-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    environment: Production Release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: artifacts/*
